; f4sr settings.
; Precedence: values the MCM page saved in Data\MCM\Settings\f4sr.ini
; ([Main] section) override the same keys here. Edit through MCM, or
; delete that file for these values to take effect again.
; Most MCM changes apply live; edits to this file need a game restart.
[f4sr]
; Master switch for super resolution.
bEnableUpscaling=1
; SR backend: 0 = FSR 3.1, 1 = FSR 4.1 (INT8 on RDNA3), 2 = XeSS (DP4a)
iBackend=1
; Quality: 0 = Native AA, 1 = Quality (1.5x), 2 = Balanced (1.7x), 3 = Performance (2.0x)
iQualityMode=2
; RCAS sharpening for the FSR backends, 0.0 - 1.0.
fSharpness=0.5
; Frame generation. XeSS-FG (default engine) needs this on at game start;
; turning it on later takes effect after a restart.
bEnableFrameGeneration=0
; 1 = XeSS-FG (default: better pacing, lower latency, less ghosting),
; 0 = FSR-FG (synchronous FIFO 2X, source FPS capped at half the refresh rate).
; Needs a restart.
iFrameGenEngine=1
; Allow sub-native quality modes while ENB is loaded (upscaling runs before
; ENB's post-processing). F4SR locates and adjusts some of ENB's own draws;
; if they are not found in your ENB version it stays at native resolution and
; says so in the status panel and f4sr.log. If the image looks wrong
; (shifted, shrunk into a corner), use Native AA (iQualityMode=0) and report it.
bENBSubNative=1
; Render pipeline (MCM "Render Pipeline" overrides it): 1 = UI Native, the
; game and ENB render at the preset's lower resolution, the scene is upscaled
; and the UI drawn at output resolution (needs the XeSS-FG engine; frame
; generation may be off); 0 = Classic. Startup-only. If UI Native fails, F4SR
; switches the MCM choice to Classic and shows an error panel. Keep
; Fallout4Prefs iSize W/H at the desired output size.
iPipeline=1
; UI Native only: the finished frame the upscaler reads is gamma-encoded
; SDR (8-bit, with or without ENB), so this is on: FSR 4 is told the input is
; non-linear and XeSS-SR gets a gamma 2.2 decode/encode pair. Turn off only
; for a preset that outputs linear color. Requires a restart.
bPathBNonLinearColor=1
; Reactive (transparency) mask for the upscaler: marks pixels changed by
; forward/transparent passes so they are not smeared. Startup-only.
bReactiveMask=1
; Strength of that mask (0.0 - 4.0; 1.0 = default).
fReactiveScale=1.0
; XeSS-FG generated frames per real frame: 1 = 2X, 2 = 3X, 3 = 4X. The MCM
; "XeSS-FG Multiplier" (iXeFGMode, 0 = 2X .. 2 = 4X) overrides this.
iXeFGInterpolations=1
; FSR debug view (acceptance checks): replaces the output with the
; FidelityFX debug visualization.
bDebugView=0
; Independent live MCM diagnostics; neither is enabled for normal play.
bFrameGenOverlay=0
bFrameGenCapture=0
; System summary (GPU, driver, OS, displays, related mods, F4SR settings)
; at the top of f4sr.log, for bug reports. No user or computer names; folder
; paths in the log are shortened. Startup only. MCM: Log System Info.
bLogSystemInfo=1
; Startup-only capture/trace diagnostics: raw target dumps and traces in
; the game folder, with multi-second stalls on the capture frame. Off for
; normal play.
bDiagnostics=0
; With bDiagnostics=1: virtual-key code that captures one adjacent frame
; pair (IN1/A, IN2/A2) on the next resolved frame. Hold the camera in
; motion while pressing it. Default 121 = F10; 0 disables the key.
iCaptureKey=121
; Sub-native modes: after upscaling, rewrite the scene depth in display
; layout so depth-based effects after the upscaler (including ENB) line up
; with the upscaled image. Startup-only.
bPostDepth=1
; Sub-native: guard the engine's dynamic-resolution ratio between frame start
; and the upscale seam. Something in the game occasionally rewrites it, and
; that frame is rendered at a scale the upscaler does not expect (a single
; zoomed flash frame). Uses a hardware write watchpoint on the render thread.
bDynResGuard=1
